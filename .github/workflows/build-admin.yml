name: Compilar Admin App en la Nube

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
    paths:
      - 'src/app/admin/**'
      - 'admin.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

jobs:
  build-admin:
    name: Compilar Admin
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la página y el módulo Admin
        run: |
          npx vite build --mode admin
          npm run build:admin
          test -s dist/admin.html
          test -s dist/admin.js

      - name: Guardar artefacto Admin
        uses: actions/upload-artifact@v4
        with:
          name: app-admin-dist
          path: dist/admin.js
