name: Compilar y desplegar Servidor en Cloud Run

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
    paths:
      - 'server.ts'
      - 'src/server/**'
      - 'Dockerfile'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

jobs:
  build-server:
    name: Compilar Servidor
    runs-on: ubuntu-latest
    env:
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar solo el Servidor
        run: |
          npm run build:server
          test -f dist/server.cjs

      - name: Guardar artefacto Servidor
        uses: actions/upload-artifact@v4
        with:
          name: app-server-dist
          path: dist/server.cjs

  deploy-cloud-run:
    name: Desplegar en Cloud Run
    needs: build-server
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Avisar que faltan credenciales de Google Cloud
        if: env.GCP_SA_KEY == '' || env.GCP_PROJECT_ID == ''
        run: echo "::warning::Falta configurar GCP_SA_KEY y/o GCP_PROJECT_ID en GitHub Secrets. El servidor se compiló, pero no se desplegó."

      - name: Descargar código actual
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar servidor en Cloud Run
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != ''
        run: |
          gcloud run deploy carlos02200375720mall \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region europe-west1 \
            --quiet
