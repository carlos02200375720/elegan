name: Compilar y desplegar Servidor en Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "server.ts"
      - "src/server/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/build-server.yml"
  workflow_dispatch:

concurrency:
  group: elegan-cloud-run-server
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compilar y desplegar Servidor
    runs-on: ubuntu-latest
    env:
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-east1
      CLOUD_RUN_SERVICE: elegan-backend
      GAR_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Verificar compilación del servidor
        run: |
          npm run build:server
          test -s dist/server.cjs

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar autenticación de Docker
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Construir y publicar imagen del servidor
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          test -n "$GCP_PROJECT_ID" || (echo "Falta el secreto GCP_PROJECT_ID" && exit 1)
          test -n "$GAR_REPOSITORY" || (echo "Falta el secreto GCP_ARTIFACT_REGISTRY_REPOSITORY" && exit 1)
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Verificar configuración de PayPal
        shell: bash
        run: |
          if [[ -z "$PAYPAL_CLIENT_ID" || -z "$PAYPAL_CLIENT_SECRET" ]]; then
            echo "::error::Faltan los secretos PAYPAL_CLIENT_ID y/o PAYPAL_CLIENT_SECRET en GitHub. Configúralos en Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$PAYPAL_MODE" != "sandbox" && "$PAYPAL_MODE" != "live" ]]; then
            echo "::error::PAYPAL_MODE debe ser sandbox o live."
            exit 1
          fi

      - name: Desplegar en Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --update-env-vars "PAYPAL_CLIENT_ID=$PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET=$PAYPAL_CLIENT_SECRET,PAYPAL_MODE=$PAYPAL_MODE" \
            --quiet
