name: Compilar Web App en la Nube

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
    paths:
      - 'src/app/web/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

jobs:
  build-web:
    name: Compilar Web
    runs-on: ubuntu-latest
    env:
      VITE_APP_TARGET: web
      VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
      VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar solo la Web App
        run: |
          npm run build:web
          test -f dist/index.html

      - name: Guardar artefacto Web
        uses: actions/upload-artifact@v4
        with:
          name: app-web-dist
          path: dist/
