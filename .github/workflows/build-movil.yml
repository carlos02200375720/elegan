name: Compilar App Móvil en la Nube

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
    paths:
      - 'src/app/movil/**'
      - 'movil.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/apply-movil-icons.cjs'
      - '.github/workflows/build-movil.yml'
  workflow_dispatch:

jobs:
  build-movil:
    name: Compilar App Móvil (APK y AAB)
    runs-on: ubuntu-latest
    env:
      VITE_APP_TARGET: android
      VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
      VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS >=22 para Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend Android desde cero
        env:
          VITE_APP_TARGET: android
          VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --force
          rm -rf dist
          npm run build:android
          test -f dist/index.html

    

      - name: Inicializar Capacitor y aplicar ícono único (assets/icon.png) eliminando los íconos por defecto
        run: |
          npx cap add android || true
          if [ -d "src/app/movil/res" ] && [ -d "android/app/src/main/res" ]; then
            cp -r src/app/movil/res/* android/app/src/main/res/
          fi
          if [ -f "src/app/movil/AndroidManifest.xml" ] && [ -d "android/app/src/main" ]; then
            cp src/app/movil/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          npx cap sync android
          if [ -d "src/app/movil/res" ] && [ -d "android/app/src/main/res" ]; then
            cp -r src/app/movil/res/* android/app/src/main/res/
          fi
          node scripts/apply-movil-icons.cjs || true
          
          

      

      - name: Corregir clases duplicadas de Kotlin
        run: |
          node -e "const fs=require('fs'); const f='android/build.gradle'; if(fs.existsSync(f)){const p='\\nsubprojects {\\n    configurations.all {\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk7\'\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk8\'\\n    }\\n}\\n'; fs.appendFileSync(f,p)}"

      - name: Compilar APK y Android App Bundle (.aab)
        run: |
          chmod +x android/gradlew
          cd android
          echo "=== Compilando APK Debug para pruebas directas ==="
          ./gradlew assembleDebug
          echo "=== Compilando Android App Bundle (.aab) para Google Play Store ==="
          ./gradlew bundleRelease || ./gradlew bundle

      - name: Firmar AAB (Opcional si existen secretos en GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Se encontraron credenciales de firma. Firmando bundle .aab..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            find android/app/build/outputs/bundle -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              {} "$KEY_ALIAS" \;
            rm -f release.keystore
            echo "Bundle .aab firmado con éxito."
          else
            echo "No se definieron secretos de keystore. El .aab se generó en modo release (apto para Google Play App Signing o firma manual)."
          fi

      - name: Guardar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Guardar AAB para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: app-android-playstore-bundle
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
