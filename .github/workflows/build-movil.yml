name: Compilar App Móvil en la Nube

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
    paths:
      - 'src/app/movil/**'
      - 'public/icon.png'
      - 'movil.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'scripts/apply-movil-icons.cjs'
      - '.github/workflows/build-movil.yml'
  workflow_dispatch:

jobs:
  build-movil:
    name: Compilar App Móvil (APK y AAB)
    runs-on: ubuntu-latest
    env:
      VITE_APP_TARGET: android
      VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
      VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS >=22 para Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend Android desde cero
        env:
          VITE_APP_TARGET: android
          VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --force
          rm -rf dist
          npm run build:android
          test -f dist/index.html

    

      - name: Inicializar Capacitor y aplicar ícono único (public/icon.png) eliminando los íconos por defecto
        run: |
          npx cap add android || true
          if [ -d "src/app/movil/res" ] && [ -d "android/app/src/main/res" ]; then
            cp -r src/app/movil/res/* android/app/src/main/res/
          fi
          if [ -f "src/app/movil/AndroidManifest.xml" ] && [ -d "android/app/src/main" ]; then
            cp src/app/movil/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          npx cap sync android
          if [ -d "src/app/movil/res" ] && [ -d "android/app/src/main/res" ]; then
            cp -r src/app/movil/res/* android/app/src/main/res/
          fi
          node scripts/apply-movil-icons.cjs || true
          
          

      

      - name: Corregir clases duplicadas de Kotlin
        run: |
          node -e "const fs=require('fs'); const f='android/build.gradle'; if(fs.existsSync(f)){const p='\\nsubprojects {\\n    configurations.all {\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk7\'\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk8\'\\n    }\\n}\\n'; fs.appendFileSync(f,p)}"

      - name: Compilar APK y Android App Bundle (.aab)
        run: |
          chmod +x android/gradlew
          cd android
          echo "=== Compilando APK Debug para pruebas directas ==="
          ./gradlew assembleDebug
          echo "=== Compilando Android App Bundle (.aab) para Google Play Store ==="
          ./gradlew bundleRelease || ./gradlew bundle

      - name: Firmar AAB (Opcional si existen secretos en GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Se encontraron credenciales de firma. Firmando bundle .aab..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            find android/app/build/outputs/bundle -name "*.aab" -exec jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              {} "$KEY_ALIAS" \;
            rm -f release.keystore
            echo "Bundle .aab firmado con éxito."
          else
            echo "No se definieron secretos de keystore. El .aab se generó en modo release (apto para Google Play App Signing o firma manual)."
          fi

      - name: Guardar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Guardar AAB para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: app-android-playstore-bundle
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  build-ios:
    name: Compilar App iOS (IPA para App Store)
    runs-on: macos-latest
    env:
      VITE_APP_TARGET: android
      VITE_BACKEND_URL: https://elegan-backend-587849039182.us-east1.run.app
      VITE_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      VITE_PAYPAL_MODE: ${{ secrets.PAYPAL_MODE || 'sandbox' }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias y plataforma iOS de Capacitor
        run: |
          npm install
          npm install --no-save @capacitor/ios@^8.5.3

      - name: Compilar frontend para iOS
        run: |
          rm -rf dist
          npm run build:android
          test -f dist/index.html

      - name: Crear y sincronizar proyecto iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Preparar firma de distribución de Apple
        id: firma
        shell: bash
        run: |
          if [[ -z "$IOS_CERTIFICATE_BASE64" || -z "$IOS_CERTIFICATE_PASSWORD" || -z "$IOS_PROVISIONING_PROFILE_BASE64" || -z "$IOS_TEAM_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No están configurados todos los secretos de firma de Apple. Se generará un archivo XCARCHIVE sin firma; no será instalable ni publicable todavía en App Store."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Compilar archivo de Xcode
        env:
          FIRMA_CONFIGURADA: ${{ steps.firma.outputs.configured }}
          PROFILE_UUID: ${{ steps.firma.outputs.profile_uuid }}
        run: |
          mkdir -p build/ios
          if [ "$FIRMA_CONFIGURADA" = "true" ]; then
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/ios/Elegan.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              PRODUCT_BUNDLE_IDENTIFIER=com.mall.app \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              archive
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/ios/Elegan.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              archive
          fi

      - name: Exportar IPA para App Store Connect
        if: steps.firma.outputs.configured == 'true'
        run: |
          cat > build/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mall.app</key>
              <string>${{ steps.firma.outputs.profile_uuid }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/Elegan.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist build/ios/ExportOptions.plist
          find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit | grep -q .

      - name: Guardar IPA firmado para App Store Connect
        if: steps.firma.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-app-store-ipa
          path: build/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Guardar archivo Xcode sin firma
        if: steps.firma.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-unsigned-xcarchive
          path: build/ios/Elegan.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Limpiar certificado y perfil de firma
        if: always() && steps.firma.outputs.keychain_path != ''
        run: |
          security delete-keychain "${{ steps.firma.outputs.keychain_path }}" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
